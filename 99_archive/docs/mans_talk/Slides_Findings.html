<h1>The findings that change management — 16:9 slides</h1>


<!-- ══════════ 4.1 LOSS OF THE CSF STRIPE ══════════ -->
<figure>
<svg viewBox="0 0 1920 1080" role="img" aria-label="Finding 1: Loss of the CSF stripe">
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <text x="80" y="96" font-size="44" font-weight="700" fill="#b26a00">Loss of the CSF stripe</text>
  <rect x="1560" y="60" width="280" height="46" rx="23" fill="#fdf0dc" stroke="#b26a00" stroke-width="2"/>
  <text x="1700" y="91" font-size="21" font-weight="700" fill="#b26a00" text-anchor="middle">Finding 1 of 5</text>
  <text x="80" y="140" font-size="23" fill="#5a5a5a">Mechanical, potentially reversible · <tspan font-style="italic">sagittal T2 to detect, axial T2 to characterise</tspan></text>
  <line x1="80" y1="170" x2="1840" y2="170" stroke="#e3c48f" stroke-width="3"/>

  <image href="figures/panels/kwok_sagittal_T2_multilevel.jpg" x="80" y="206" width="461" height="620"/>
  <rect x="80" y="206" width="461" height="620" fill="none" stroke="#d8d8d8" stroke-width="2"/>
  <text x="80" y="862" font-size="19" fill="#1a1a1a">Generous at C3–C4. Squeezed out at <tspan font-weight="700">C5–C6</tspan> and <tspan font-weight="700">C6–C7</tspan>.</text>
  <text x="80" y="892" font-size="17" fill="#6b7780" font-style="italic">Kwok &amp; Cheung, BMC Musculoskelet Disord 2020, Fig 1 · CC BY 4.0</text>

  <text x="600" y="252" font-size="27" font-weight="700" fill="#1a1a1a">The bright CSF outlining the cord thins, then disappears.</text>
  <text x="600" y="300" font-size="24" fill="#1a1a1a">Trace the anterior and posterior columns <tspan font-weight="700">separately</tspan> — they are effaced</text>
  <text x="600" y="334" font-size="24" fill="#1a1a1a">independently, and the pattern matters.</text>

  <rect x="600" y="384" width="1240" height="260" rx="10" fill="#fdf0dc" stroke="#b26a00" stroke-width="2.4"/>
  <text x="632" y="432" font-size="24" font-weight="700" fill="#b26a00">How to grade it</text>
  <text x="632" y="486" font-size="23" fill="#1a1a1a"><tspan font-weight="700" font-size="26">Grade 0</tspan>   Normal subarachnoid space</text>
  <text x="632" y="528" font-size="23" fill="#1a1a1a"><tspan font-weight="700" font-size="26">Grade 1</tspan>   Partial obliteration, anterior <tspan font-style="italic">or</tspan> posterior</text>
  <text x="632" y="570" font-size="23" fill="#1a1a1a"><tspan font-weight="700" font-size="26">Grade 2</tspan>   Complete obliteration, <tspan font-weight="700">no cord deformity</tspan></text>
  <text x="632" y="612" font-size="23" fill="#1a1a1a"><tspan font-weight="700" font-size="26">Grade 3</tspan>   Cord deformity or impingement</text>

  <text x="600" y="712" font-size="24" font-weight="700" fill="#1a1a1a">What it means</text>
  <text x="600" y="756" font-size="23" fill="#1a1a1a">Effacement without deformity is the entry point to the</text>
  <text x="600" y="790" font-size="23" fill="#1a1a1a">“asymptomatic compression” conversation.</text>
  <text x="600" y="834" font-size="23" font-weight="700" fill="#b26a00">On its own it is not an operative finding.</text>

  <rect x="600" y="890" width="1240" height="110" rx="10" fill="#b26a00"/>
  <text x="632" y="940" font-size="28" font-weight="700" fill="#ffffff">This is step 1 of the read.</text>
  <text x="632" y="978" font-size="24" fill="#f6e3c8">Scroll the sagittal T2 and mark every level where the stripe goes.</text>
</svg>
</figure>


<!-- ══════════ 4.2 CORD DEFORMATION ══════════ -->
<figure>
<svg viewBox="0 0 1920 1080" role="img" aria-label="Finding 2: Cord deformation">
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <text x="80" y="96" font-size="44" font-weight="700" fill="#b26a00">Cord deformation</text>
  <rect x="1560" y="60" width="280" height="46" rx="23" fill="#fdf0dc" stroke="#b26a00" stroke-width="2"/>
  <text x="1700" y="91" font-size="21" font-weight="700" fill="#b26a00" text-anchor="middle">Finding 2 of 5</text>
  <text x="80" y="140" font-size="23" fill="#5a5a5a">Mechanical, potentially reversible · <tspan font-style="italic">axial T2 at the narrowest level — never grade shape off a sagittal</tspan></text>
  <line x1="80" y1="170" x2="1840" y2="170" stroke="#e3c48f" stroke-width="3"/>

  <image href="figures/panels/kad_A_impingement.jpg" x="80" y="216" width="300" height="288"/>
  <rect x="80" y="216" width="300" height="288" fill="none" stroke="#d8d8d8" stroke-width="2"/>
  <text x="230" y="544" font-size="24" font-weight="700" fill="#b26a00" text-anchor="middle">indented</text>
  <text x="230" y="576" font-size="19" fill="#1a1a1a" text-anchor="middle">CSF preserved all round</text>

  <image href="figures/panels/kad_B_flattened.jpg" x="410" y="216" width="300" height="288"/>
  <rect x="410" y="216" width="300" height="288" fill="none" stroke="#d8d8d8" stroke-width="2"/>
  <text x="560" y="544" font-size="24" font-weight="700" fill="#b26a00" text-anchor="middle">flattened</text>
  <text x="560" y="576" font-size="19" fill="#1a1a1a" text-anchor="middle">ventral CSF partly gone</text>

  <image href="figures/panels/kad_C_severe.jpg" x="740" y="216" width="300" height="288"/>
  <rect x="740" y="216" width="300" height="288" fill="none" stroke="#d8d8d8" stroke-width="2"/>
  <text x="890" y="544" font-size="24" font-weight="700" fill="#a32020" text-anchor="middle">severe</text>
  <text x="890" y="576" font-size="19" fill="#1a1a1a" text-anchor="middle">CSF effaced</text>

  <line x1="80" y1="612" x2="1040" y2="612" stroke="#e3c48f" stroke-width="2"/>
  <text x="80" y="656" font-size="24" fill="#1a1a1a">The normal cervical cord is a <tspan font-weight="700">rounded oval</tspan>, wider side-to-side</text>
  <text x="80" y="690" font-size="24" fill="#1a1a1a">than front-to-back. Under compression it flattens, then becomes</text>
  <text x="80" y="724" font-size="24" fill="#1a1a1a">crescentic as the anterior surface is indented.</text>
  <text x="80" y="782" font-size="17" fill="#6b7780" font-style="italic">Kadanka et al., Front Neurol 2024;15:1341371, Fig 1 · CC BY 4.0</text>

  <rect x="1090" y="216" width="750" height="290" rx="10" fill="#fdf0dc" stroke="#b26a00" stroke-width="2.4"/>
  <text x="1122" y="266" font-size="26" font-weight="700" fill="#b26a00">Compression ratio</text>
  <text x="1122" y="322" font-size="27" fill="#1a1a1a">smallest AP diameter</text>
  <line x1="1122" y1="338" x2="1420" y2="338" stroke="#1a1a1a" stroke-width="2"/>
  <text x="1122" y="376" font-size="27" fill="#1a1a1a">largest transverse diameter</text>
  <text x="1122" y="432" font-size="24" font-weight="700" fill="#1a1a1a">Lower is worse.</text>
  <text x="1122" y="472" font-size="22" fill="#1a1a1a">Two readers measuring the same cord agree closely — ICC 0.80.</text>

  <rect x="1090" y="546" width="750" height="236" rx="10" fill="#ffffff" stroke="#b26a00" stroke-width="2.4"/>
  <text x="1122" y="598" font-size="26" font-weight="700" fill="#b26a00">Cord shape beats canal diameter</text>
  <text x="1122" y="650" font-size="23" fill="#1a1a1a">It reflects what is happening to the <tspan font-weight="700">neural tissue</tspan></text>
  <text x="1122" y="684" font-size="23" fill="#1a1a1a">rather than to the container it sits in.</text>
  <text x="1122" y="740" font-size="23" fill="#1a1a1a">A roomy canal around a flattened cord is still</text>
  <text x="1122" y="774" font-size="23" fill="#1a1a1a">a flattened cord.</text>

  <rect x="80" y="836" width="1760" height="110" rx="10" fill="#b26a00"/>
  <text x="120" y="886" font-size="28" font-weight="700" fill="#ffffff">Never grade cord shape off a sagittal.</text>
  <text x="120" y="924" font-size="24" fill="#f6e3c8">Shape is an axial finding. A sagittal will tell you where to look, and nothing more.</text>
</svg>
</figure>


<!-- ══════════ 4.3 T2 HYPERINTENSITY ══════════ -->
<figure>
<svg viewBox="0 0 1920 1080" role="img" aria-label="Finding 3: T2 hyperintensity in the cord">
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <text x="80" y="96" font-size="44" font-weight="700" fill="#a32020">T2 hyperintensity in the cord</text>
  <rect x="1560" y="60" width="280" height="46" rx="23" fill="#fbeaea" stroke="#a32020" stroke-width="2"/>
  <text x="1700" y="91" font-size="21" font-weight="700" fill="#a32020" text-anchor="middle">Finding 3 of 5</text>
  <text x="80" y="140" font-size="23" fill="#5a5a5a">The cord itself is injured · <tspan font-style="italic">sagittal T2 to detect, </tspan><tspan font-style="italic" font-weight="700">axial T2 to confirm it is real</tspan></text>
  <line x1="80" y1="170" x2="1840" y2="170" stroke="#e0b8b8" stroke-width="3"/>

  <image href="figures/from_web/snakeeye_fig3_myelomalacia.jpg" x="80" y="212" width="700" height="560"/>
  <rect x="80" y="212" width="700" height="560" fill="none" stroke="#d8d8d8" stroke-width="2"/>
  <text x="80" y="812" font-size="21" fill="#1a1a1a"><tspan font-weight="700">(a)</tspan> sagittal T2 finds it · <tspan font-weight="700">(b)</tspan> axial T2 at that level confirms it is really in the cord</text>
  <text x="80" y="846" font-size="17" fill="#6b7780" font-style="italic">Snake-Eye Myelopathy and Surgical Prognosis, J Clin Med 2020;9:2197, Fig 3 · CC BY 4.0</text>

  <text x="836" y="256" font-size="25" fill="#1a1a1a">Bright signal <tspan font-style="italic">within</tspan> the cord substance, usually at or</text>
  <text x="836" y="290" font-size="25" fill="#1a1a1a">just above the level of maximal compression, often</text>
  <text x="836" y="324" font-size="25" fill="#1a1a1a">centred on central grey matter.</text>

  <rect x="836" y="366" width="490" height="150" rx="10" fill="#fbeaea" stroke="#a32020" stroke-width="2.2"/>
  <text x="866" y="414" font-size="25" font-weight="700" fill="#a32020">Focal</text>
  <text x="866" y="452" font-size="22" fill="#1a1a1a">One segment.</text>
  <text x="866" y="486" font-size="22" fill="#1a1a1a">Crisp margins.</text>

  <rect x="1350" y="366" width="490" height="150" rx="10" fill="#fbeaea" stroke="#a32020" stroke-width="2.2"/>
  <text x="1380" y="414" font-size="25" font-weight="700" fill="#a32020">Diffuse</text>
  <text x="1380" y="452" font-size="22" fill="#1a1a1a">Spanning segments.</text>
  <text x="1380" y="486" font-size="22" fill="#1a1a1a">Hazy, ill-defined.</text>

  <text x="836" y="576" font-size="27" font-weight="700" fill="#1a1a1a">Then count the levels — that is what carries the weight.</text>

  <rect x="836" y="610" width="1004" height="90" rx="10" fill="#fbeaea" stroke="#a32020" stroke-width="2.2"/>
  <text x="866" y="650" font-size="24" font-weight="700" fill="#a32020">Multilevel</text>
  <text x="1050" y="650" font-size="23" fill="#1a1a1a">Worse baseline severity, lower recovery ratio.</text>
  <text x="1050" y="684" font-size="23" fill="#1a1a1a"><tspan font-weight="700">p = 0.001</tspan> · present in 27% of patients.</text>

  <rect x="836" y="714" width="1004" height="90" rx="10" fill="#f4f6f8" stroke="#8fa3b5" stroke-width="2.2"/>
  <text x="866" y="754" font-size="24" font-weight="700" fill="#41627f">Single level</text>
  <text x="1050" y="754" font-size="23" fill="#1a1a1a">Outcomes no different from no signal change</text>
  <text x="1050" y="788" font-size="23" fill="#1a1a1a">at all. <tspan font-weight="700">p = 0.275</tspan></text>

  <rect x="836" y="854" width="1004" height="146" rx="10" fill="#a32020"/>
  <text x="866" y="906" font-size="28" font-weight="700" fill="#ffffff">T2 signal alone decides nothing.</text>
  <text x="866" y="948" font-size="24" fill="#f2d4d4">It raises concern; it does not make the decision.</text>
  <text x="866" y="982" font-size="24" fill="#f2d4d4">Count the levels before you weight it.</text>
</svg>
</figure>


<!-- ══════════ 4.4 T1 HYPOINTENSITY ══════════ -->
<figure>
<svg viewBox="0 0 1920 1080" role="img" aria-label="Finding 4: T1 hypointensity, the money finding">
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <text x="80" y="96" font-size="44" font-weight="700" fill="#a32020">T1 hypointensity <tspan font-size="34" font-style="italic">— the money finding</tspan></text>
  <rect x="1560" y="60" width="280" height="46" rx="23" fill="#fbeaea" stroke="#a32020" stroke-width="2"/>
  <text x="1700" y="91" font-size="21" font-weight="700" fill="#a32020" text-anchor="middle">Finding 4 of 5</text>
  <text x="80" y="140" font-size="23" fill="#5a5a5a">The cord itself is injured · <tspan font-style="italic">sagittal T1, deliberately, at every level where T2 was bright</tspan></text>
  <line x1="80" y1="170" x2="1840" y2="170" stroke="#e0b8b8" stroke-width="3"/>

  <image href="figures/panels/arvin_E_low_T1.jpg" x="80" y="212" width="303" height="600"/>
  <rect x="80" y="212" width="303" height="600" fill="none" stroke="#d8d8d8" stroke-width="2"/>
  <text x="231" y="848" font-size="21" font-weight="700" fill="#a32020" text-anchor="middle">low T1 signal</text>
  <text x="231" y="878" font-size="18" fill="#1a1a1a" text-anchor="middle">cavitation, established</text>

  <image href="figures/panels/kato_D_post_new_T1hypo.jpg" x="413" y="212" width="255" height="600"/>
  <rect x="413" y="212" width="255" height="600" fill="none" stroke="#d8d8d8" stroke-width="2"/>
  <text x="540" y="848" font-size="21" font-weight="700" fill="#a32020" text-anchor="middle">new, after surgery</text>
  <text x="540" y="878" font-size="18" fill="#1a1a1a" text-anchor="middle">mJOA still improved 11→13</text>

  <text x="80" y="928" font-size="17" fill="#6b7780" font-style="italic">Arvin, Spine 2013, Fig 1e · Kato, Spine 2018, Fig 2d · permission pending</text>

  <text x="724" y="256" font-size="25" fill="#1a1a1a">Cord darker than normal cord at the same level. This is</text>
  <text x="724" y="290" font-size="25" fill="#1a1a1a">cavitation and established myelomalacia — <tspan font-weight="700">not reversible</tspan></text>
  <text x="724" y="324" font-size="25" fill="#1a1a1a"><tspan font-weight="700">oedema.</tspan></text>
  <text x="724" y="372" font-size="25" font-weight="700" fill="#a32020">It will not announce itself. You have to switch</text>
  <text x="724" y="406" font-size="25" font-weight="700" fill="#a32020">sequences and go looking for it.</text>

  <rect x="724" y="444" width="1116" height="176" rx="10" fill="#fbeaea" stroke="#a32020" stroke-width="2.4"/>
  <text x="756" y="490" font-size="23" fill="#1a1a1a">Reduced recovery ratio</text>
  <text x="1700" y="490" font-size="23" font-weight="700" fill="#a32020" text-anchor="end">p = 0.03</text>
  <line x1="756" y1="506" x2="1808" y2="506" stroke="#e0b8b8" stroke-width="1.6"/>
  <text x="756" y="546" font-size="23" fill="#1a1a1a">Lower odds of an optimal outcome</text>
  <text x="1700" y="546" font-size="23" font-weight="700" fill="#a32020" text-anchor="end">OR 0.45, p = 0.005</text>
  <line x1="756" y1="562" x2="1808" y2="562" stroke="#e0b8b8" stroke-width="1.6"/>
  <text x="756" y="602" font-size="23" fill="#1a1a1a">Does post-op resolution improve outcome?</text>
  <text x="1700" y="602" font-size="23" font-weight="700" fill="#a32020" text-anchor="end">No — p = 0.36, unlike T2</text>

  <rect x="724" y="650" width="1116" height="164" rx="10" fill="#ffffff" stroke="#a32020" stroke-width="2.4"/>
  <text x="756" y="696" font-size="24" font-weight="700" fill="#a32020">The caveat that must travel with it</text>
  <text x="756" y="738" font-size="22" fill="#1a1a1a">Inter-rater agreement is only <tspan font-weight="700">fair</tspan> — κ = 0.31, versus 0.60 for T2 — and it</text>
  <text x="756" y="770" font-size="22" fill="#1a1a1a">appears in under 20% of patients. When you think you see it, say</text>
  <text x="756" y="802" font-size="22" font-style="italic" font-weight="700" fill="#a32020">“possible T1 hypointensity — worth a second look.”</text>

  <rect x="724" y="852" width="1116" height="148" rx="10" fill="#a32020"/>
  <text x="756" y="898" font-size="23" fill="#f2d4d4">Say this to the patient</text>
  <text x="756" y="944" font-size="26" font-weight="700" fill="#ffffff">“This doesn’t mean don’t operate. It means the goal shifts from</text>
  <text x="756" y="980" font-size="26" font-weight="700" fill="#ffffff">restoring what you’ve lost toward protecting what you still have.”</text>
</svg>
</figure>


<!-- ══════════ 4.5 CORD ATROPHY ══════════ -->
<figure>
<svg viewBox="0 0 1920 1080" role="img" aria-label="Finding 5: Cord atrophy">
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <text x="80" y="96" font-size="44" font-weight="700" fill="#a32020">Cord atrophy</text>
  <rect x="1520" y="60" width="320" height="46" rx="23" fill="#a32020"/>
  <text x="1680" y="91" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Finding 5 of 5 · the worst</text>
  <text x="80" y="140" font-size="23" fill="#5a5a5a">The cord itself is injured · <tspan font-style="italic">sagittal T2 for impression, axial T2 compared to uninvolved levels</tspan></text>
  <line x1="80" y1="170" x2="1840" y2="170" stroke="#a32020" stroke-width="4"/>

  <image href="figures/from_web/atrophy_fig6_2yr_thin_cord.jpg" x="80" y="212" width="600" height="600"/>
  <rect x="80" y="212" width="600" height="600" fill="none" stroke="#d8d8d8" stroke-width="2"/>
  <text x="80" y="854" font-size="21" fill="#1a1a1a"><tspan font-weight="700">(A)</tspan> axial C5–6: CSF restored all round, but the cord is visibly thinned.</text>
  <text x="80" y="886" font-size="21" fill="#1a1a1a"><tspan font-weight="700">(B)</tspan> sagittal: focal myelomalacia, widened dorsal CSF — chronic remodelling.</text>
  <text x="80" y="924" font-size="17" fill="#6b7780" font-style="italic">Two-year follow-up after anterior cervical corpectomy.</text>
  <text x="80" y="950" font-size="17" fill="#6b7780" font-style="italic">Cureus 2026;18:e107566, Fig 6 · CC BY 4.0</text>

  <rect x="724" y="206" width="1116" height="150" rx="10" fill="#fbeaea" stroke="#a32020" stroke-width="3.4"/>
  <text x="756" y="256" font-size="27" font-weight="700" fill="#a32020">This is the worst finding on the list.</text>
  <text x="756" y="300" font-size="24" fill="#1a1a1a">Cord tissue has been lost and will not grow back. Where T2 signal change</text>
  <text x="756" y="334" font-size="24" fill="#1a1a1a">can resolve after decompression, <tspan font-weight="700">atrophy does not.</tspan></text>

  <text x="724" y="410" font-size="24" font-weight="700" fill="#1a1a1a">What you see</text>
  <text x="724" y="452" font-size="23" fill="#1a1a1a">Reduced cord calibre, often with a deceptively <tspan font-weight="700" font-style="italic">roomy</tspan> CSF space.</text>

  <rect x="724" y="486" width="1116" height="120" rx="10" fill="#f4f6f8" stroke="#8fa3b5" stroke-width="2.2"/>
  <text x="756" y="530" font-size="24" font-weight="700" fill="#41627f">The trap</text>
  <text x="756" y="572" font-size="23" fill="#1a1a1a">The canal is not roomy because the compression resolved — it is roomy</text>
  <text x="756" y="600" font-size="23" fill="#1a1a1a">because the <tspan font-weight="700">cord shrank into it.</tspan></text>

  <text x="724" y="662" font-size="24" font-weight="700" fill="#1a1a1a">The mimic</text>
  <text x="724" y="704" font-size="23" fill="#1a1a1a">Physiologic tapering below the cervical enlargement (roughly below C6) is</text>
  <text x="724" y="736" font-size="23" fill="#1a1a1a">normal. Compare to expected calibre <tspan font-style="italic">at that level</tspan>, not to the enlargement above.</text>

  <text x="724" y="798" font-size="23" fill="#1a1a1a">The example shown is post-operative because the contrast is easiest to see —</text>
  <text x="724" y="830" font-size="23" fill="#1a1a1a">but atrophy is <tspan font-weight="700">not</tspan> a post-surgical finding. It occurs in long-standing untreated</text>
  <text x="724" y="862" font-size="23" fill="#1a1a1a">compression too, and that is where it does the most damage.</text>

  <text x="756" y="944" font-size="28" font-weight="700" fill="#ffffff">Trust the examination over the roominess.</text>
