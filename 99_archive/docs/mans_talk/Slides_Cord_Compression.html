<h1>Reading the Compressed Cord — 16:9 slides</h1>


<!-- ══════════════════ SLIDE 1 ══════════════════ -->
<figure>
<svg viewBox="0 0 1920 1080" role="img" aria-label="Slide 1: Before you open the study">
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <text x="80" y="98" font-size="46" font-weight="700" fill="#1f4e79">1 · Before you open the study</text>
  <text x="80" y="146" font-size="24" fill="#5a5a5a">Three habits, ten seconds each. They change what you see.</text>
  <line x1="80" y1="176" x2="1840" y2="176" stroke="#d8d8d8" stroke-width="2"/>

  <rect x="80" y="222" width="560" height="560" rx="10" fill="#eef3f8" stroke="#1f4e79" stroke-width="2.4"/>
  <rect x="80" y="222" width="10" height="560" rx="5" fill="#1f4e79"/>
  <circle cx="140" cy="284" r="26" fill="#1f4e79"/>
  <text x="140" y="294" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
  <text x="182" y="278" font-size="28" font-weight="700" fill="#1f4e79">Know the clinical</text>
  <text x="182" y="312" font-size="28" font-weight="700" fill="#1f4e79">question first</text>
  <text x="122" y="380" font-size="22" fill="#1a1a1a">“Weak hands, dropping objects,</text>
  <text x="122" y="412" font-size="22" fill="#1a1a1a">wide-based gait, eight months”</text>
  <text x="122" y="444" font-size="22" fill="#1a1a1a">sends you to the cord.</text>
  <line x1="122" y1="490" x2="598" y2="490" stroke="#b6cade" stroke-width="1.8"/>
  <text x="122" y="536" font-size="23" font-weight="700" fill="#1f4e79">A read without a question</text>
  <text x="122" y="568" font-size="23" font-weight="700" fill="#1f4e79">is a tour, not an</text>
  <text x="122" y="600" font-size="23" font-weight="700" fill="#1f4e79">examination.</text>

  <rect x="680" y="222" width="560" height="560" rx="10" fill="#eef3f8" stroke="#1f4e79" stroke-width="2.4"/>
  <rect x="680" y="222" width="10" height="560" rx="5" fill="#1f4e79"/>
  <circle cx="740" cy="284" r="26" fill="#1f4e79"/>
  <text x="740" y="294" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
  <text x="782" y="278" font-size="28" font-weight="700" fill="#1f4e79">Do not read the</text>
  <text x="782" y="312" font-size="28" font-weight="700" fill="#1f4e79">report first</text>
  <text x="722" y="380" font-size="22" fill="#1a1a1a">Reading the impression destroys</text>
  <text x="722" y="412" font-size="22" fill="#1a1a1a">the training value of the study.</text>
  <text x="722" y="444" font-size="22" fill="#1a1a1a">You will see what you were told</text>
  <text x="722" y="476" font-size="22" fill="#1a1a1a">to see.</text>
  <line x1="722" y1="512" x2="1198" y2="512" stroke="#b6cade" stroke-width="1.8"/>
  <text x="722" y="558" font-size="23" font-weight="700" fill="#1f4e79">Read cold, commit in</text>
  <text x="722" y="590" font-size="23" font-weight="700" fill="#1f4e79">writing, then compare.</text>

  <rect x="1280" y="222" width="560" height="560" rx="10" fill="#fbeaea" stroke="#a32020" stroke-width="2.4"/>
  <rect x="1280" y="222" width="10" height="560" rx="5" fill="#a32020"/>
  <circle cx="1340" cy="284" r="26" fill="#a32020"/>
  <text x="1340" y="294" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
  <text x="1382" y="278" font-size="28" font-weight="700" fill="#a32020">Check the study can</text>
  <text x="1382" y="312" font-size="28" font-weight="700" fill="#a32020">answer the question</text>
  <text x="1322" y="380" font-size="22" fill="#1a1a1a">No axial T2 through the level of</text>
  <text x="1322" y="412" font-size="22" fill="#1a1a1a">interest? Then nobody can grade</text>
  <text x="1322" y="444" font-size="22" fill="#1a1a1a">the compression — including the</text>
  <text x="1322" y="476" font-size="22" fill="#1a1a1a">radiologist.</text>
  <line x1="1322" y1="512" x2="1798" y2="512" stroke="#e0b8b8" stroke-width="1.8"/>
  <text x="1322" y="558" font-size="23" font-weight="700" fill="#a32020">Recognising an inadequate</text>
  <text x="1322" y="590" font-size="23" font-weight="700" fill="#a32020">study is itself a</text>
  <text x="1322" y="622" font-size="23" font-weight="700" fill="#a32020">clinical skill.</text>

  <rect x="80" y="836" width="1760" height="132" rx="10" fill="#1f4e79"/>
  <text x="120" y="898" font-size="30" font-weight="700" fill="#ffffff">You will find degeneration, because everyone has it.</text>
  <text x="120" y="940" font-size="26" fill="#cfe0ee">The only thing that makes it a finding is the question you brought with you.</text>
</svg>
</figure>


<!-- ══════════════════ SLIDE 2 ══════════════════ -->
<figure>
<svg viewBox="0 0 1920 1080" role="img" aria-label="Slide 2: Which sequence is which">
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <text x="80" y="98" font-size="46" font-weight="700" fill="#1f4e79">2 · Which sequence is which</text>
  <text x="80" y="146" font-size="24" fill="#5a5a5a">One patient, one sitting, three sequences. The anatomy never changed — only what the scanner was asked to make bright.</text>
  <line x1="80" y1="176" x2="1840" y2="176" stroke="#d8d8d8" stroke-width="2"/>

  <text x="227" y="222" font-size="26" font-weight="700" fill="#b26a00" text-anchor="middle">a · STIR</text>
  <text x="520" y="222" font-size="26" font-weight="700" fill="#136f63" text-anchor="middle">b · T2</text>
  <text x="813" y="222" font-size="26" font-weight="700" fill="#1f4e79" text-anchor="middle">c · T1</text>

  <image href="figures/from_web/trauma_fig9_STIR_T2_T1_cerv.jpg" x="80" y="236" width="880" height="389"/>
  <rect x="80" y="236" width="880" height="389" fill="none" stroke="#d8d8d8" stroke-width="2"/>
  <line x1="373.3" y1="236" x2="373.3" y2="625" stroke="#ffffff" stroke-width="2.5" opacity=".85"/>
  <line x1="666.7" y1="236" x2="666.7" y2="625" stroke="#ffffff" stroke-width="2.5" opacity=".85"/>

  <rect x="140" y="646" width="30" height="21" rx="4" fill="#ffffff" stroke="#8c959d" stroke-width="1.6"/>
  <text x="178" y="663" font-size="17" fill="#1a1a1a">CSF</text>
  <rect x="248" y="646" width="30" height="21" rx="4" fill="#23282d" stroke="#8c959d" stroke-width="1.6"/>
  <text x="286" y="663" font-size="17" fill="#1a1a1a">Fat</text>
  <text x="227" y="700" font-size="21" font-weight="700" fill="#b26a00" text-anchor="middle">fat is suppressed</text>

  <rect x="433" y="646" width="30" height="21" rx="4" fill="#ffffff" stroke="#8c959d" stroke-width="1.6"/>
  <text x="471" y="663" font-size="17" fill="#1a1a1a">CSF</text>
  <rect x="541" y="646" width="30" height="21" rx="4" fill="#ffffff" stroke="#8c959d" stroke-width="1.6"/>
  <text x="579" y="663" font-size="17" fill="#1a1a1a">Fat</text>
  <text x="520" y="700" font-size="21" font-weight="700" fill="#136f63" text-anchor="middle">both bright</text>

  <rect x="726" y="646" width="30" height="21" rx="4" fill="#23282d" stroke="#8c959d" stroke-width="1.6"/>
  <text x="764" y="663" font-size="17" fill="#1a1a1a">CSF</text>
  <rect x="834" y="646" width="30" height="21" rx="4" fill="#ffffff" stroke="#8c959d" stroke-width="1.6"/>
  <text x="872" y="663" font-size="17" fill="#1a1a1a">Fat</text>
  <text x="813" y="700" font-size="21" font-weight="700" fill="#1f4e79" text-anchor="middle">the reverse of T2</text>

  <text x="80" y="736" font-size="17" fill="#6b7780" font-style="italic">Sjoberg et al., Children 2023;10:1094, Figure 9 · CC BY 4.0</text>

  <rect x="1010" y="222" width="830" height="514" rx="10" fill="#eef3f8" stroke="#1f4e79" stroke-width="2.4"/>
  <rect x="1010" y="222" width="10" height="514" rx="5" fill="#1f4e79"/>
  <text x="1054" y="286" font-size="30" fill="#1f4e79" font-weight="700">The two-step tell</text>

  <circle cx="1072" cy="352" r="20" fill="#1f4e79"/>
  <text x="1072" y="360" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
  <text x="1108" y="346" font-size="25" fill="#1a1a1a" font-weight="700">Look at the CSF column.</text>
  <text x="1108" y="382" font-size="25" fill="#1a1a1a">Bright → STIR or T2.   Dark → <tspan font-weight="700" fill="#1f4e79">T1</tspan>.</text>

  <circle cx="1072" cy="452" r="20" fill="#1f4e79"/>
  <text x="1072" y="460" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
  <text x="1108" y="446" font-size="25" fill="#1a1a1a" font-weight="700">Then the fat behind the neck.</text>
  <text x="1108" y="482" font-size="25" fill="#1a1a1a">Dark → <tspan font-weight="700" fill="#b26a00">STIR</tspan>.   Bright → <tspan font-weight="700" fill="#136f63">T2</tspan>.</text>

  <line x1="1054" y1="528" x2="1796" y2="528" stroke="#c9d6e3" stroke-width="2"/>
  <text x="1054" y="576" font-size="22" fill="#1a1a1a">Two sequences show bright CSF, so the CSF column alone</text>
  <text x="1054" y="608" font-size="22" fill="#1a1a1a">cannot separate STIR from T2. <tspan font-weight="700">The suppressed fat does.</tspan></text>
  <text x="1054" y="660" font-size="22" fill="#1a1a1a">Get it wrong and you will call cord oedema on a STIR image,</text>
  <text x="1054" y="692" font-size="22" fill="#1a1a1a">which makes almost everything look bright.</text>

  <rect x="80" y="774" width="420" height="176" rx="10" fill="#e4f2f0" stroke="#136f63" stroke-width="2.2"/>
  <rect x="80" y="774" width="9" height="176" rx="4.5" fill="#136f63"/>
  <text x="116" y="822" font-size="30" font-weight="700" fill="#136f63">T2</text>
  <text x="116" y="866" font-size="21" fill="#1a1a1a">Compression, and</text>
  <text x="116" y="896" font-size="21" fill="#1a1a1a">T2 hyperintensity.</text>
  <text x="116" y="930" font-size="18" font-style="italic" fill="#136f63">the only place you grade</text>

  <rect x="526" y="774" width="420" height="176" rx="10" fill="#eef3f8" stroke="#1f4e79" stroke-width="2.2"/>
  <rect x="526" y="774" width="9" height="176" rx="4.5" fill="#1f4e79"/>
  <text x="562" y="822" font-size="30" font-weight="700" fill="#1f4e79">T1</text>
  <text x="562" y="866" font-size="21" fill="#1a1a1a">Anatomy, and</text>
  <text x="562" y="896" font-size="21" fill="#1a1a1a">T1 hypointensity.</text>
  <text x="562" y="930" font-size="18" font-style="italic" fill="#1f4e79">the change that does not reverse</text>

  <rect x="972" y="774" width="420" height="176" rx="10" fill="#fdf0dc" stroke="#b26a00" stroke-width="2.2"/>
  <rect x="972" y="774" width="9" height="176" rx="4.5" fill="#b26a00"/>
  <text x="1008" y="822" font-size="30" font-weight="700" fill="#b26a00">STIR</text>
  <text x="1008" y="866" font-size="21" fill="#1a1a1a">Oedema, and what</text>
  <text x="1008" y="896" font-size="21" fill="#1a1a1a">T2 masked in fat.</text>
  <text x="1008" y="930" font-size="18" font-style="italic" fill="#b26a00">sensitive, not specific</text>

  <rect x="1418" y="774" width="422" height="176" rx="10" fill="#eef2f6" stroke="#5a7d9e" stroke-width="2.2"/>
  <rect x="1418" y="774" width="9" height="176" rx="4.5" fill="#5a7d9e"/>
  <text x="1454" y="822" font-size="30" font-weight="700" fill="#41627f">GRE / T2*</text>
  <text x="1454" y="866" font-size="21" fill="#1a1a1a">Ossified ligament,</text>
  <text x="1454" y="896" font-size="21" fill="#1a1a1a">calcium and blood.</text>
  <text x="1454" y="930" font-size="18" font-style="italic" fill="#41627f">axial · MERGE, MEDIC, T2*</text>

  <text x="80" y="1010" font-size="26" font-weight="700" fill="#1f4e79">Everything downstream depends on knowing which sequence you are looking at without being told.</text>
</svg>
</figure>


<!-- ══════════════════ SLIDE 3 ══════════════════ -->
<figure>
<svg viewBox="0 0 1920 1080" role="img" aria-label="Slide 3: The eight-step read">
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="sfw" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8fa3b5"/></marker>
  </defs>
  <text x="80" y="98" font-size="46" font-weight="700" fill="#1f4e79">3 · The eight-step read</text>
  <text x="80" y="146" font-size="24" fill="#5a5a5a">Sagittal T2 finds it · sagittal T1 confirms it · axial T2 grades it. Front-loaded by urgency — interrupted after step three and you already have what matters.</text>
  <line x1="80" y1="176" x2="1840" y2="176" stroke="#d8d8d8" stroke-width="2"/>

  <rect x="80" y="216" width="400" height="220" rx="10" fill="#fbeaea" stroke="#a32020" stroke-width="2.4"/>
  <text x="112" y="268" font-size="27" font-weight="700" fill="#a32020">1 · Sagittal T2, scroll</text>
  <text x="112" y="318" font-size="22" fill="#1a1a1a">Where does the bright CSF</text>
  <text x="112" y="350" font-size="22" fill="#1a1a1a">stripe disappear?</text>
  <text x="112" y="392" font-size="22" font-weight="700" fill="#a32020">Mark every level.</text>
  <line x1="492" y1="326" x2="528" y2="326" stroke="#8fa3b5" stroke-width="2.6" marker-end="url(#sfw)"/>

  <rect x="540" y="216" width="400" height="220" rx="10" fill="#fbeaea" stroke="#a32020" stroke-width="2.4"/>
  <text x="572" y="268" font-size="27" font-weight="700" fill="#a32020">2 · Cord signal</text>
  <text x="572" y="318" font-size="22" fill="#1a1a1a">Bright signal <tspan font-style="italic">inside</tspan> the cord,</text>
  <text x="572" y="350" font-size="22" fill="#1a1a1a">at those same levels?</text>
  <text x="572" y="392" font-size="22" font-weight="700" fill="#a32020">Focal or diffuse? How many?</text>
  <line x1="952" y1="326" x2="988" y2="326" stroke="#8fa3b5" stroke-width="2.6" marker-end="url(#sfw)"/>

  <rect x="1000" y="216" width="400" height="220" rx="10" fill="#fbeaea" stroke="#a32020" stroke-width="3.4"/>
  <text x="1032" y="268" font-size="27" font-weight="700" fill="#a32020">3 · Switch to sagittal T1</text>
  <text x="1032" y="318" font-size="22" fill="#1a1a1a">Is the cord <tspan font-weight="700">dark</tspan> where T2</text>
  <text x="1032" y="350" font-size="22" fill="#1a1a1a">was bright?</text>
  <text x="1032" y="392" font-size="22" font-weight="700" fill="#a32020">The step everyone skips.</text>
  <line x1="1412" y1="326" x2="1448" y2="326" stroke="#8fa3b5" stroke-width="2.6" marker-end="url(#sfw)"/>

  <rect x="1460" y="216" width="380" height="220" rx="10" fill="#fdf0dc" stroke="#b26a00" stroke-width="2.4"/>
  <text x="1492" y="268" font-size="27" font-weight="700" fill="#b26a00">4 · Axial T2</text>
  <text x="1492" y="318" font-size="22" fill="#1a1a1a">At every flagged level.</text>
  <text x="1492" y="366" font-size="22" font-weight="700" fill="#b26a00">This is where you grade.</text>

  <rect x="80" y="472" width="400" height="220" rx="10" fill="#fdf0dc" stroke="#b26a00" stroke-width="2.4"/>
  <text x="112" y="524" font-size="27" font-weight="700" fill="#b26a00">5 · Alignment</text>
  <text x="112" y="574" font-size="22" fill="#1a1a1a">Lordotic, straight or</text>
  <text x="112" y="606" font-size="22" fill="#1a1a1a">kyphotic? Five seconds.</text>
  <text x="112" y="648" font-size="22" font-weight="700" fill="#b26a00">Decides the approach.</text>
  <line x1="492" y1="582" x2="528" y2="582" stroke="#8fa3b5" stroke-width="2.6" marker-end="url(#sfw)"/>

  <rect x="540" y="472" width="400" height="220" rx="10" fill="#fdf0dc" stroke="#b26a00" stroke-width="2.4"/>
  <text x="572" y="524" font-size="27" font-weight="700" fill="#b26a00">6 · Soft or hard?</text>
  <text x="572" y="574" font-size="22" fill="#1a1a1a">Disc, osteophyte or</text>
  <text x="572" y="606" font-size="22" fill="#1a1a1a">ossified ligament.</text>
  <text x="572" y="648" font-size="22" font-weight="700" fill="#b26a00">Unsure? That is a CT question.</text>
  <line x1="952" y1="582" x2="988" y2="582" stroke="#8fa3b5" stroke-width="2.6" marker-end="url(#sfw)"/>

  <rect x="1000" y="472" width="400" height="220" rx="10" fill="#e4f2f0" stroke="#136f63" stroke-width="2.4"/>
  <text x="1032" y="524" font-size="27" font-weight="700" fill="#136f63">7 · Foramina</text>
  <text x="1032" y="574" font-size="22" fill="#1a1a1a">Root compromise at</text>
  <text x="1032" y="606" font-size="22" fill="#1a1a1a">each level.</text>
  <text x="1032" y="648" font-size="22" font-weight="700" fill="#136f63">Radiculopathy changes the plan.</text>
  <line x1="1412" y1="582" x2="1448" y2="582" stroke="#8fa3b5" stroke-width="2.6" marker-end="url(#sfw)"/>

  <rect x="1460" y="472" width="380" height="220" rx="10" fill="#e4f2f0" stroke="#136f63" stroke-width="2.4"/>
  <text x="1492" y="524" font-size="27" font-weight="700" fill="#136f63">8 · Everything else</text>
  <text x="1492" y="574" font-size="22" fill="#1a1a1a">Marrow, soft tissue,</text>
  <text x="1492" y="606" font-size="22" fill="#1a1a1a">lung apices,</text>
  <text x="1492" y="638" font-size="22" fill="#1a1a1a">posterior fossa.</text>

  <rect x="80" y="752" width="1760" height="150" rx="10" fill="#f4f6f8" stroke="#8fa3b5" stroke-width="2.2"/>
  <text x="120" y="812" font-size="30" font-weight="700" fill="#1f4e79">The safety rule</text>
  <text x="120" y="862" font-size="25" fill="#1a1a1a">Your read exists to <tspan font-weight="700">raise</tspan> urgency, never to lower it. A degenerative-looking scan does not exclude ALS, MS, B12 deficiency or cord tumour.</text>

  <text x="80" y="978" font-size="26" font-weight="700" fill="#1f4e79">Same order, every time. The order is the skill.</text>
</svg>
</figure>


<!-- ══════════════════ SLIDE 4 ══════════════════ -->
<figure>
<svg viewBox="0 0 1920 1080" role="img" aria-label="Slide 4: The findings that change management">
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="esc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a32020"/></marker>
  </defs>
  <text x="80" y="98" font-size="46" font-weight="700" fill="#1f4e79">4 · The findings that change management</text>
  <text x="80" y="146" font-size="24" fill="#5a5a5a"><tspan fill="#b26a00" font-weight="700">Orange</tspan> = mechanical, potentially reversible · <tspan fill="#a32020" font-weight="700">Red</tspan> = the cord itself is injured. Ordered worst-<tspan font-style="italic">last</tspan>.</text>
  <line x1="80" y1="176" x2="1840" y2="176" stroke="#d8d8d8" stroke-width="2"/>

  <line x1="80" y1="206" x2="1810" y2="206" stroke="#a32020" stroke-width="2.4" marker-end="url(#esc)" opacity=".5"/>
  <text x="1700" y="196" font-size="19" font-style="italic" fill="#a32020" text-anchor="end">increasing severity</text>

  <rect x="80" y="230" width="336" height="600" rx="10" fill="#fdf0dc" stroke="#b26a00" stroke-width="2.4"/>
  <rect x="80" y="230" width="9" height="600" rx="4.5" fill="#b26a00"/>
  <text x="116" y="282" font-size="26" font-weight="700" fill="#b26a00">Loss of the</text>
  <text x="116" y="314" font-size="26" font-weight="700" fill="#b26a00">CSF stripe</text>
  <text x="116" y="354" font-size="18" font-style="italic" fill="#5a5a5a">sagittal T2 to detect</text>
  <text x="116" y="380" font-size="18" font-style="italic" fill="#5a5a5a">axial T2 to characterise</text>
  <line x1="116" y1="404" x2="384" y2="404" stroke="#e3c48f" stroke-width="1.8"/>
  <text x="116" y="444" font-size="20" fill="#1a1a1a">Trace anterior and</text>
  <text x="116" y="472" font-size="20" fill="#1a1a1a">posterior columns</text>
  <text x="116" y="500" font-size="20" font-weight="700" fill="#1a1a1a">separately.</text>
  <text x="116" y="552" font-size="19" fill="#1a1a1a"><tspan font-weight="700">0</tspan>  normal</text>
  <text x="116" y="582" font-size="19" fill="#1a1a1a"><tspan font-weight="700">1</tspan>  partial, ant <tspan font-style="italic">or</tspan> post</text>
  <text x="116" y="612" font-size="19" fill="#1a1a1a"><tspan font-weight="700">2</tspan>  complete, no deformity</text>
  <text x="116" y="642" font-size="19" fill="#1a1a1a"><tspan font-weight="700">3</tspan>  cord deformity</text>
  <line x1="116" y1="674" x2="384" y2="674" stroke="#e3c48f" stroke-width="1.8"/>
  <text x="116" y="716" font-size="19" fill="#1a1a1a">Effacement without</text>
  <text x="116" y="744" font-size="19" fill="#1a1a1a">deformity is not an</text>
  <text x="116" y="772" font-size="19" font-weight="700" fill="#b26a00">operative finding.</text>

  <rect x="436" y="230" width="336" height="600" rx="10" fill="#fdf0dc" stroke="#b26a00" stroke-width="2.4"/>
  <rect x="436" y="230" width="9" height="600" rx="4.5" fill="#b26a00"/>
  <text x="472" y="282" font-size="26" font-weight="700" fill="#b26a00">Cord</text>
  <text x="472" y="314" font-size="26" font-weight="700" fill="#b26a00">deformation</text>
  <text x="472" y="354" font-size="18" font-style="italic" fill="#5a5a5a">axial T2 at the narrowest</text>
  <text x="472" y="380" font-size="18" font-style="italic" fill="#5a5a5a">level — never off a sagittal</text>
  <line x1="472" y1="404" x2="740" y2="404" stroke="#e3c48f" stroke-width="1.8"/>
  <text x="472" y="444" font-size="20" fill="#1a1a1a">Rounded oval → flat →</text>
  <text x="472" y="472" font-size="20" fill="#1a1a1a">crescentic.</text>
  <text x="472" y="524" font-size="20" font-weight="700" fill="#1a1a1a">Compression ratio</text>
  <text x="472" y="552" font-size="19" fill="#1a1a1a">smallest AP ÷ largest</text>
  <text x="472" y="580" font-size="19" fill="#1a1a1a">transverse. Lower is worse.</text>
  <text x="472" y="616" font-size="19" fill="#1a1a1a">Two readers agree closely</text>
  <text x="472" y="644" font-size="19" fill="#1a1a1a">(ICC 0.80).</text>
  <line x1="472" y1="674" x2="740" y2="674" stroke="#e3c48f" stroke-width="1.8"/>
  <text x="472" y="716" font-size="19" font-weight="700" fill="#b26a00">Cord shape beats canal</text>
  <text x="472" y="744" font-size="19" font-weight="700" fill="#b26a00">diameter</text>
  <text x="472" y="772" font-size="19" fill="#1a1a1a">— tissue, not container.</text>

  <rect x="792" y="230" width="336" height="600" rx="10" fill="#fbeaea" stroke="#a32020" stroke-width="2.4"/>
  <rect x="792" y="230" width="9" height="600" rx="4.5" fill="#a32020"/>
  <text x="828" y="282" font-size="26" font-weight="700" fill="#a32020">T2 hyperintensity</text>
  <text x="828" y="314" font-size="26" font-weight="700" fill="#a32020">in the cord</text>
  <text x="828" y="354" font-size="18" font-style="italic" fill="#5a5a5a">sagittal T2 to detect</text>
  <text x="828" y="380" font-size="18" font-style="italic" fill="#5a5a5a">axial T2 to confirm it is real</text>
  <line x1="828" y1="404" x2="1096" y2="404" stroke="#e0b8b8" stroke-width="1.8"/>
  <text x="828" y="444" font-size="20" fill="#1a1a1a">Focal (one segment, crisp)</text>
  <text x="828" y="472" font-size="20" fill="#1a1a1a">or diffuse (hazy, spanning).</text>
  <text x="828" y="500" font-size="20" font-weight="700" fill="#1a1a1a">Count the levels.</text>
  <text x="828" y="552" font-size="19" font-weight="700" fill="#1a1a1a">Multilevel</text>
  <text x="828" y="580" font-size="19" fill="#1a1a1a">worse recovery, p = 0.001.</text>
  <text x="828" y="608" font-size="19" fill="#1a1a1a">Present in 27%.</text>
  <text x="828" y="644" font-size="19" font-weight="700" fill="#1a1a1a">Single level</text>
  <text x="828" y="672" font-size="19" fill="#1a1a1a">no different from none at</text>
  <text x="828" y="700" font-size="19" fill="#1a1a1a">all, p = 0.275.</text>
  <line x1="828" y1="726" x2="1096" y2="726" stroke="#e0b8b8" stroke-width="1.8"/>
  <text x="828" y="764" font-size="19" font-weight="700" fill="#a32020">Alone it decides nothing.</text>
  <text x="828" y="792" font-size="19" fill="#1a1a1a">Count levels before you</text>
  <text x="828" y="816" font-size="19" fill="#1a1a1a">weight it.</text>

  <rect x="1148" y="230" width="336" height="600" rx="10" fill="#fbeaea" stroke="#a32020" stroke-width="2.4"/>
  <rect x="1148" y="230" width="9" height="600" rx="4.5" fill="#a32020"/>
  <text x="1184" y="282" font-size="26" font-weight="700" fill="#a32020">T1 hypointensity</text>
  <text x="1184" y="314" font-size="22" font-style="italic" fill="#a32020">the money finding</text>
  <text x="1184" y="354" font-size="18" font-style="italic" fill="#5a5a5a">sagittal T1, deliberately, at</text>
  <text x="1184" y="380" font-size="18" font-style="italic" fill="#5a5a5a">every level T2 was bright</text>
  <line x1="1184" y1="404" x2="1452" y2="404" stroke="#e0b8b8" stroke-width="1.8"/>
  <text x="1184" y="444" font-size="20" fill="#1a1a1a">Cavitation and established</text>
  <text x="1184" y="472" font-size="20" fill="#1a1a1a">myelomalacia — <tspan font-weight="700">not</tspan></text>
  <text x="1184" y="500" font-size="20" fill="#1a1a1a">reversible oedema.</text>
  <text x="1184" y="552" font-size="19" fill="#1a1a1a">Reduced recovery, p = 0.03</text>
  <text x="1184" y="580" font-size="19" fill="#1a1a1a">Optimal outcome OR 0.45</text>
  <text x="1184" y="608" font-size="19" fill="#1a1a1a">Post-op resolution helps?</text>
  <text x="1184" y="636" font-size="19" font-weight="700" fill="#a32020">No (p = 0.36) — unlike T2</text>
  <line x1="1184" y1="666" x2="1452" y2="666" stroke="#e0b8b8" stroke-width="1.8"/>
  <text x="1184" y="704" font-size="19" font-weight="700" fill="#a32020">Agreement is only fair</text>
  <text x="1184" y="732" font-size="19" fill="#1a1a1a">κ = 0.31 vs 0.60 for T2. Say</text>
  <text x="1184" y="760" font-size="19" font-style="italic" fill="#1a1a1a">“possible T1 hypointensity</text>
  <text x="1184" y="788" font-size="19" font-style="italic" fill="#1a1a1a">— worth a second look.”</text>

  <rect x="1504" y="230" width="336" height="600" rx="10" fill="#fbeaea" stroke="#a32020" stroke-width="3.6"/>
  <rect x="1504" y="230" width="9" height="600" rx="4.5" fill="#a32020"/>
  <text x="1540" y="282" font-size="26" font-weight="700" fill="#a32020">Cord atrophy</text>
  <text x="1540" y="314" font-size="22" font-style="italic" fill="#a32020">the worst finding here</text>
  <text x="1540" y="354" font-size="18" font-style="italic" fill="#5a5a5a">axial T2 compared to</text>
  <text x="1540" y="380" font-size="18" font-style="italic" fill="#5a5a5a">uninvolved levels</text>
  <line x1="1540" y1="404" x2="1808" y2="404" stroke="#e0b8b8" stroke-width="1.8"/>
  <text x="1540" y="444" font-size="20" fill="#1a1a1a">Cord tissue is gone and</text>
  <text x="1540" y="472" font-size="20" fill="#1a1a1a">will not grow back. T2</text>
  <text x="1540" y="500" font-size="20" fill="#1a1a1a">signal can resolve.</text>
  <text x="1540" y="528" font-size="20" font-weight="700" fill="#1a1a1a">Atrophy does not.</text>
  <line x1="1540" y1="562" x2="1808" y2="562" stroke="#e0b8b8" stroke-width="1.8"/>
  <text x="1540" y="602" font-size="19" font-weight="700" fill="#a32020">The trap</text>
  <text x="1540" y="630" font-size="19" fill="#1a1a1a">A deceptively <tspan font-style="italic">roomy</tspan> canal.</text>
  <text x="1540" y="658" font-size="19" fill="#1a1a1a">It is roomy because the</text>
  <text x="1540" y="686" font-size="19" fill="#1a1a1a">cord shrank into it — not</text>
  <text x="1540" y="714" font-size="19" fill="#1a1a1a">because compression</text>
  <text x="1540" y="742" font-size="19" fill="#1a1a1a">resolved.</text>
  <text x="1540" y="784" font-size="19" font-weight="700" fill="#a32020">Trust the examination</text>
  <text x="1540" y="812" font-size="19" font-weight="700" fill="#a32020">over the roominess.</text>

  <rect x="80" y="866" width="1760" height="118" rx="10" fill="#a32020"/>
  <text x="120" y="922" font-size="29" font-weight="700" fill="#ffffff">Surgery for atrophy is about protecting what remains, not restoring what has gone.</text>
  <text x="120" y="962" font-size="24" fill="#f2d4d4">Set that expectation before the operation, not after it.</text>
</svg>
</figure>


<!-- ══════════════════ SLIDE 5 ══════════════════ -->
<figure>
<svg viewBox="0 0 1920 1080" role="img" aria-label="Slide 5: Three things that will fool you">
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <text x="80" y="98" font-size="46" font-weight="700" fill="#1f4e79">5 · Three things that will fool you</text>
  <text x="80" y="146" font-size="24" fill="#5a5a5a">Every one is a false positive that looks convincing on a single image and evaporates on a second plane.</text>
  <line x1="80" y1="176" x2="1840" y2="176" stroke="#d8d8d8" stroke-width="2"/>

  <rect x="80" y="216" width="560" height="620" rx="10" fill="#ffffff" stroke="#a32020" stroke-width="2.4"/>
  <rect x="80" y="216" width="560" height="112" rx="10" fill="#fbeaea"/>
  <rect x="80" y="216" width="560" height="112" fill="#fbeaea"/>
  <text x="116" y="264" font-size="28" font-weight="700" fill="#a32020">Truncation (Gibbs)</text>
  <text x="116" y="300" font-size="28" font-weight="700" fill="#a32020">artifact</text>
  <line x1="80" y1="328" x2="640" y2="328" stroke="#a32020" stroke-width="2"/>
  <text x="116" y="380" font-size="20" font-weight="700" fill="#5a5a5a">WHAT FOOLS YOU</text>
  <text x="116" y="424" font-size="22" fill="#1a1a1a">A thin bright line down the</text>
  <text x="116" y="454" font-size="22" fill="#1a1a1a">centre of the cord on sagittal</text>
  <text x="116" y="484" font-size="22" fill="#1a1a1a">T2. Reads as a syrinx or</text>
  <text x="116" y="514" font-size="22" fill="#1a1a1a">extensive signal change.</text>
  <text x="116" y="556" font-size="21" fill="#1a1a1a">Linear, uniform, spanning</text>
  <text x="116" y="586" font-size="21" fill="#1a1a1a">many segments.</text>
  <rect x="116" y="620" width="488" height="180" rx="8" fill="#e4f2f0" stroke="#136f63" stroke-width="2.2"/>
  <text x="140" y="662" font-size="20" font-weight="700" fill="#136f63">THE DISPROOF</text>
  <text x="140" y="702" font-size="22" fill="#1a1a1a">Look at the axial. No cavity —</text>
  <text x="140" y="732" font-size="22" fill="#1a1a1a">the central signal is a flat,</text>
  <text x="140" y="762" font-size="22" fill="#1a1a1a">lip-shaped slit.</text>
  <text x="140" y="790" font-size="19" font-style="italic" fill="#136f63">Real signal change is segmental.</text>

  <rect x="680" y="216" width="560" height="620" rx="10" fill="#ffffff" stroke="#a32020" stroke-width="2.4"/>
  <rect x="680" y="216" width="560" height="112" fill="#fbeaea"/>
  <text x="716" y="264" font-size="28" font-weight="700" fill="#a32020">CSF flow artifact</text>
  <text x="716" y="300" font-size="22" font-style="italic" fill="#a32020">mimics effacement, and blood</text>
  <line x1="680" y1="328" x2="1240" y2="328" stroke="#a32020" stroke-width="2"/>
  <text x="716" y="380" font-size="20" font-weight="700" fill="#5a5a5a">WHAT FOOLS YOU</text>
  <text x="716" y="424" font-size="22" fill="#1a1a1a">Moving CSF loses signal, so</text>
  <text x="716" y="454" font-size="22" fill="#1a1a1a">dark patches appear in the</text>
  <text x="716" y="484" font-size="22" fill="#1a1a1a">subarachnoid space and read</text>
  <text x="716" y="514" font-size="22" fill="#1a1a1a">as a lost CSF stripe — or, if</text>
  <text x="716" y="544" font-size="22" fill="#1a1a1a">eccentric, as haemorrhage.</text>
  <rect x="716" y="596" width="488" height="204" rx="8" fill="#e4f2f0" stroke="#136f63" stroke-width="2.2"/>
  <text x="740" y="638" font-size="20" font-weight="700" fill="#136f63">THE DISPROOF</text>
  <text x="740" y="678" font-size="22" fill="#1a1a1a">Repeat as gradient echo.</text>
  <text x="740" y="716" font-size="22" fill="#1a1a1a"><tspan font-weight="700">Flow vanishes</tspan> — CSF goes a</text>
  <text x="740" y="746" font-size="22" fill="#1a1a1a">clean uniform bright ring.</text>
  <text x="740" y="784" font-size="22" fill="#1a1a1a"><tspan font-weight="700">Blood blooms</tspan> bigger and blacker.</text>

  <rect x="1280" y="216" width="560" height="620" rx="10" fill="#ffffff" stroke="#a32020" stroke-width="2.4"/>
  <rect x="1280" y="216" width="560" height="112" fill="#fbeaea"/>
  <text x="1316" y="264" font-size="28" font-weight="700" fill="#a32020">Oblique slice angle</text>
  <text x="1316" y="300" font-size="22" font-style="italic" fill="#a32020">the one that runs toward reassurance</text>
  <line x1="1280" y1="328" x2="1840" y2="328" stroke="#a32020" stroke-width="2"/>
  <text x="1316" y="380" font-size="20" font-weight="700" fill="#5a5a5a">WHAT FOOLS YOU</text>
  <text x="1316" y="424" font-size="22" fill="#1a1a1a">An axial not perpendicular to</text>
  <text x="1316" y="454" font-size="22" fill="#1a1a1a">the cord cuts it on the slant.</text>
  <text x="1316" y="484" font-size="22" fill="#1a1a1a">Front-to-back stretches by</text>
  <text x="1316" y="514" font-size="22" fill="#1a1a1a">1 ÷ cos θ; side-to-side does not.</text>
  <text x="1316" y="552" font-size="22" fill="#1a1a1a">At 30°, the ratio reads</text>
  <text x="1316" y="582" font-size="22" fill="#1a1a1a"><tspan font-weight="700" fill="#a32020">0.64</tspan> when the truth is <tspan font-weight="700" fill="#136f63">0.55</tspan>.</text>
  <rect x="1316" y="616" width="488" height="184" rx="8" fill="#e4f2f0" stroke="#136f63" stroke-width="2.2"/>
  <text x="1340" y="658" font-size="20" font-weight="700" fill="#136f63">THE DISPROOF</text>
  <text x="1340" y="698" font-size="22" fill="#1a1a1a">Check slice angulation on the</text>
  <text x="1340" y="728" font-size="22" fill="#1a1a1a">localiser before trusting any</text>
  <text x="1340" y="758" font-size="22" fill="#1a1a1a">compression ratio. If it is</text>
  <text x="1340" y="788" font-size="22" fill="#1a1a1a">oblique, do not quote a number.</text>

  <rect x="80" y="872" width="1760" height="126" rx="10" fill="#1f4e79"/>
  <text x="120" y="924" font-size="29" font-weight="700" fill="#ffffff">“Measurement unreliable at this level — slice angulation.”</text>
  <text x="120" y="968" font-size="24" fill="#cfe0ee">That sentence tells the surgeon more than a falsely reassuring number, and it is entirely within your control.</text>
</svg>
</figure>


<!-- ══════════════════ SLIDE 6 ══════════════════ -->
<figure>
<svg viewBox="0 0 1920 1080" role="img" aria-label="Slide 6: What you can and cannot call">
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <text x="80" y="98" font-size="46" font-weight="700" fill="#1f4e79">6 · What you can and cannot call</text>
  <text x="80" y="146" font-size="24" fill="#5a5a5a">You cannot read severity of disease off severity of compression. The examination decides that, not the picture.</text>
  <line x1="80" y1="176" x2="1840" y2="176" stroke="#d8d8d8" stroke-width="2"/>

  <image href="figures/from_web/kadanka_fig2_dcm_vs_adcc.jpg" x="80" y="216" width="660" height="600"/>
  <rect x="80" y="216" width="660" height="600" fill="none" stroke="#d8d8d8" stroke-width="2"/>
  <rect x="80" y="838" width="24" height="24" rx="5" fill="#a32020"/>
  <text x="118" y="857" font-size="21" fill="#1a1a1a"><tspan font-weight="700" fill="#a32020">Top row (A, B)</tspan> — symptomatic degenerative cervical myelopathy</text>
  <rect x="80" y="876" width="24" height="24" rx="5" fill="#136f63"/>
  <text x="118" y="895" font-size="21" fill="#1a1a1a"><tspan font-weight="700" fill="#136f63">Bottom row (C, D)</tspan> — no myelopathic signs or symptoms at all</text>
  <text x="80" y="936" font-size="19" fill="#6b7780" font-style="italic">Same sequences, same planes, no visible difference in the severity of compression.</text>
  <text x="80" y="962" font-size="18" fill="#6b7780" font-style="italic">Kadanka et al., Front Neurol 2024;15:1341371, Fig 2 · CC BY 4.0</text>

  <rect x="790" y="216" width="512" height="600" rx="10" fill="#e4f2f0" stroke="#136f63" stroke-width="2.4"/>
  <rect x="790" y="216" width="512" height="66" rx="10" fill="#136f63"/>
  <rect x="790" y="262" width="512" height="20" fill="#136f63"/>
  <text x="822" y="262" font-size="26" font-weight="700" fill="#ffffff">Call it and act on it</text>
  <text x="822" y="336" font-size="21" fill="#1a1a1a">Presence, level and number of</text>
  <text x="822" y="364" font-size="21" fill="#1a1a1a">levels of compression</text>
  <text x="822" y="418" font-size="21" fill="#1a1a1a">Loss of CSF signal around the cord</text>
  <text x="822" y="472" font-size="21" fill="#1a1a1a">Cord deformation and gross atrophy</text>
  <text x="822" y="526" font-size="21" fill="#1a1a1a">T2 hyperintensity, and cautiously</text>
  <text x="822" y="554" font-size="21" fill="#1a1a1a">T1 hypointensity</text>
  <text x="822" y="608" font-size="21" fill="#1a1a1a">Gross alignment — lordosis,</text>
  <text x="822" y="636" font-size="21" fill="#1a1a1a">kyphosis, listhesis</text>
  <line x1="822" y1="676" x2="1270" y2="676" stroke="#9ccdc4" stroke-width="2"/>
  <text x="822" y="722" font-size="22" font-weight="700" fill="#136f63">Study adequacy for the</text>
  <text x="822" y="752" font-size="22" font-weight="700" fill="#136f63">clinical question</text>
  <text x="822" y="788" font-size="19" font-style="italic" fill="#5a5a5a">— the one nobody else will check</text>

  <rect x="1328" y="216" width="512" height="600" rx="10" fill="#fbeaea" stroke="#a32020" stroke-width="2.4"/>
  <rect x="1328" y="216" width="512" height="66" rx="10" fill="#a32020"/>
  <rect x="1328" y="262" width="512" height="20" fill="#a32020"/>
  <text x="1360" y="262" font-size="26" font-weight="700" fill="#ffffff">Defer it, always</text>
  <text x="1360" y="336" font-size="21" fill="#1a1a1a">Any mass, marrow replacement or</text>
  <text x="1360" y="364" font-size="21" fill="#1a1a1a">enhancing lesion</text>
  <text x="1360" y="418" font-size="21" fill="#1a1a1a">Infection — discitis, epidural</text>
  <text x="1360" y="446" font-size="21" fill="#1a1a1a">abscess, paraspinal collection</text>
  <text x="1360" y="500" font-size="21" fill="#1a1a1a">Intramedullary lesions not clearly</text>
  <text x="1360" y="528" font-size="21" fill="#1a1a1a">compression-related</text>
  <text x="1360" y="582" font-size="21" fill="#1a1a1a">Anything outside the spine on the</text>
  <text x="1360" y="610" font-size="21" fill="#1a1a1a">visible slices</text>
