figshare_01:
  query_id: figshare_01
  source_code: R2
  source_name: Figshare articles search API
  source: figshare
  section: R2. Figshare
  role: search
  form: fenced
  grammar: boolean
  string: '{"search_for": "(:title: spine OR :title: spinal OR :title: vertebra OR :title: vertebrae OR :title: vertebral OR :title: lumbar OR :title: thoracolumbar OR :title: lumbosacral OR :title: sacrum OR :title: scoliosis OR :title: spondylolisthesis OR :description: vertebra OR :description: vertebrae OR :description: vertebral OR :description: \"lumbar spine\" OR :description: \"thoracic spine\" OR :description: \"cervical spine\" OR :description: scoliosis) AND (:title: CT OR :title: \"computed tomography\" OR :title: CBCT OR :title: radiograph OR :title: radiographs OR :title: radiography OR :title: x-ray OR :title: x-rays OR :title: xray OR :title: fluoroscopy OR :title: fluoroscopic OR :title: DXA OR :title: DEXA OR :title: EOS OR :title: biplanar OR :description: \"computed tomography\" OR :description: CT OR :description: radiograph OR :description: radiographs OR :description: radiography OR :description: x-ray OR :description: x-rays OR :description: fluoroscopy OR :description: \"C-arm\" OR :description: DXA OR :description: DEXA OR :description: EOS OR :description: biplanar)", "item_type": 3, "page_size": 1000, "page": 1, "order": "published_date", "order_direction": "asc", "published_since": "2000-01-01", "published_until": "2026-12-31"}'
  verbatim_in_markdown: true
  method: POST
  endpoint: https://api.figshare.com/v2/articles/search
  body: <string> (JSON)
  params: {}
  headers:
    Content-Type: application/json
  paging: page_size <= 1000 with page; if page stops before the reported total (verify) the offset/limit form is the fallback, used and logged
  cap: null
  rate_limit: 2/s
  date_filter: api
  coverage: 2011-
  credential: none
  credential_free_behaviour: no credential exists for this source
  credential_mode_expected: credential-free
  raw_cache_published: true
  raw_cache_reason: article metadata is open
  syntax_notes: 'The string is the JSON request body sent verbatim. search_for grammar: :title: and :description: field prefixes, AND OR NOT, phrases in double quotes JSON-escaped as \"...\" (single quotes tokenise as separate terms); item_type 3 = dataset; published_since/published_until are the date filter; order published_date asc keeps paging stable.'
  enrichment: GET /v2/articles/{id} (licence, DOI, is_embargoed, is_public) and GET /v2/articles/{id}/files (computed_md5, size, download_url)
  pre_run_check: 'the one-phrase body {"search_for": ":description: \"lumbar spine\""} is sent once with page_size 1 and its count recorded in queries.json[figshare_01].notes; a zero is a deviations-log row'
