# Data repositories and indexes (R1-R14): Zenodo, Figshare, Dryad, OSF, Mendeley Data, DataCite, PhysioNet,
# TCIA/NBIA, Kaggle, Hugging Face, grand-challenge.org, GitHub, Papers with Code, OpenDataLab.
#
# MATERIALISED BY HAND FROM information_sources.md (the protocol's single source of truth for every
# search string, PROTOCOL.md 6.1) and CHECKED, not generated: tests/test_queries_yaml.py loads the
# markdown through sdr.common.load_queries and fails on a one-byte difference for every entry with
# verbatim_in_markdown: true (Makefile protocol-check and manuscript/build.sh run it). No generator
# exists; a change to either file is made by hand in both and the test is the gate (deviations log, 2026-09-19).
# Where the markdown line is annotated or elided ("... query=", "(candidate 1)", "(verify; fallback ...)",
# "(the same body with the item_type key removed)"), `string` is the operational form the adapter
# sends and `markdown_string` keeps the markdown text verbatim so the appendix can print both.
#
# CONTRACT. A flat mapping query_id -> entry, loadable with sdr.common.load_queries(path); every
# top-level key is a query_id as it will appear in runs/<run-date>/queries.json and in Appendix A.
# Per entry: query_id, source_code (L1..S1 of the summary table), source_name, source (the adapter
# name and the key sdr.common.rate_for reads), section (the markdown heading), role (search | chase |
# enrich | probe | supplement | supplementary | fallback | conditional-split), form (fenced | grid |
# term | template | derived | regex | list-in-prose), grammar (boolean | grid | list | dump-filter |
# chase | enrich | probe | regex), string (verbatim, unencoded; the adapter URL-encodes it),
# verbatim_in_markdown, optional markdown_id / grid_id / markdown_string / markdown_prose (the sentence of
# information_sources.md that specifies an entry given in prose rather than as a block), method (GET |
# POST | local, the mention harvests that send no request), endpoint,
# string_param (which parameter receives `string`) or body (POST), params (secret-stripped; the
# placeholders <NCBI_API_KEY>, <S2_API_KEY>, <CONTACT>, <HF_TOKEN>, <GITHUB_TOKEN>, <OSF_TOKEN>,
# <SPRINGER_API_META_KEY>, <string>, <continue.*>, <base64(KAGGLE_USERNAME:KAGGLE_KEY)> are substituted by the
# adapter and never written
# to any output), headers (placeholders likewise), paging, cap (null or the cap), rate_limit,
# date_filter (api | local | none), coverage (PRISMA-ScR item 7), credential (a NAME, never a value),
# credential_free_behaviour, credential_mode_expected (the queries.json credential_mode the run is
# expected to record on a host with the credentials named in PROTOCOL.md 15 and none other: keyed |
# credential-free | needs-credentials | html-fallback | no-public-api | retired | not-run |
# mendeley-via-datacite), raw_cache_published with raw_cache_reason (summary-table column), and
# syntax_notes (how this source's grammar differs from the shared term blocks). Optional keys:
# local_filter, enrichment, follow_up_requests, fallback, pre_run_check, condition, notes,
# param_variants (Open-i: one entry per yaml id, n_requests counting every variant), intervals,
# language, pass_, osf_collection, candidate_rule, condition (conditional-split ids, sent only when it
# holds), not_run_reason (ids with no adapter in this version: the run writes them as not-run with
# hits null), endpoint_rule (how the adapter chooses the endpoint when it is decided at run time),
# fallback (endpoint and mode recorded when the primary endpoint fails).
#
# Hit counts and dates are never written here; the run records them in queries.json.
# Unpaywall (S2) is a charting tool with no query_id and is absent by design.
#
zenodo_01:
  query_id: zenodo_01
  source_code: R1
  source_name: Zenodo records API (InvenioRDM)
  source: zenodo
  section: R1. Zenodo
  role: search
  form: fenced
  grammar: boolean
  string: ((metadata.title:(spine OR spinal OR vertebra* OR lumbar OR thoracolumbar OR lumbosacral OR sacrum OR "cervical spine" OR "thoracic spine" OR scoliosis OR spondylolisthesis) OR metadata.description:(spine OR spinal OR vertebra* OR lumbar OR thoracolumbar OR lumbosacral OR sacrum OR "cervical spine" OR "thoracic spine" OR scoliosis OR spondylolisthesis) OR metadata.subjects.subject:(spine OR spinal OR vertebra* OR scoliosis)) AND (metadata.title:(CT OR "computed tomography" OR CBCT OR "cone-beam" OR radiograph* OR "x-ray" OR "x-rays" OR xray* OR roentgen* OR fluoroscop* OR "c-arm" OR DXA OR DEXA OR EOS OR biplanar) OR metadata.description:(CT OR "computed tomography" OR "computed tomographic" OR CBCT OR "cone-beam" OR "cone beam" OR radiograph* OR "x-ray" OR "x-rays" OR "x ray" OR xray* OR roentgen* OR fluoroscop* OR "c-arm" OR "image intensifier" OR DXA OR DEXA OR absorptiometry OR "vertebral fracture assessment" OR EOS OR biplanar OR "plain film") OR metadata.subjects.subject:(CT OR radiograph* OR "x-ray" OR xray* OR fluoroscop* OR DXA)) AND metadata.resource_type.id:(dataset OR image* OR software OR other) AND metadata.publication_date:[2000-01-01 TO 2026-12-31])
  verbatim_in_markdown: true
  method: GET
  endpoint: https://zenodo.org/api/records
  string_param: q
  params:
    q: <string>
    size: 100
    page: 1
    sort: bestmatch
  paging: page x size <= 10,000; above that the metadata.publication_date range is split by year
  cap: 10000
  rate_limit: 1/s (guest policy)
  date_filter: api
  coverage: 2013-05-
  credential: none
  credential_free_behaviour: no credential exists for this source
  credential_mode_expected: credential-free
  raw_cache_published: true
  raw_cache_reason: record metadata is open
  syntax_notes: 'One dialect only, the InvenioRDM field names of post-2023 Zenodo: metadata.title:, metadata.description:, metadata.subjects.subject: (where legacy keywords are indexed), metadata.resource_type.id:, metadata.publication_date:[a TO b]; * truncation; quoted phrases; AND OR. The legacy shortcuts title:/description:/keywords: are not used (keywords: matches nothing since the migration). BLOCK_D is omitted because every Zenodo record is a deposit.'
  enrichment: 'per hit: files[].checksum, files[].size, metadata.license.id, metadata.access_right, metadata.related_identifiers, conceptdoi (concept DOIs collapse versions)'
  pre_run_check: each of the four fielded clauses (spine, modality, resource-type, date) is sent alone with size=1 and must return hits.total > 0; the four counts are written to queries.json[zenodo_01].notes and a zero is a deviations-log row before anything else runs
