  role: search
  form: fenced
  grammar: list
  string: https://services.cancerimagingarchive.net/nbia-api/services/v1/getCollectionValues
  verbatim_in_markdown: true
  method: GET
  endpoint: https://services.cancerimagingarchive.net/nbia-api/services/v1/getCollectionValues
  params: {}
  paging: unpaged
  cap: null
  rate_limit: 2/s
  date_filter: local
  coverage: 2011-
  credential: none (public collections)
  credential_free_behaviour: no credential exists for public collections
  credential_mode_expected: credential-free
  raw_cache_published: true
  raw_cache_reason: NBIA metadata is open
  syntax_notes: 'No query interface: every collection is enumerated and its body-part and modality values filtered locally. Chest, abdomen and pelvis collections without a spine body part or a spine description are not candidates (they fail I1 unless a literature record describes spine annotations on them). Limited-access collections are flagged for the probe (P10-P11).'
  candidate_rule:
    body_part_regex: (?i)spine|vertebr|sacr|lumbar|thorac|cervic|whole ?body|^[ctl]\s*-?\s*spine$
    modalities:
    - CT
    - CR
    - DX
    - RF
    - XA
    - OT
    or: the collection description page https://www.cancerimagingarchive.net/collection/<slug>/ (fetched once) matches SPINE_RE
  follow_up_requests:
  - GET .../v1/getBodyPartValues?Collection=<c> and GET .../v1/getModalityValues?Collection=<c> for every collection
  - 'for candidates: GET .../v1/getPatientByCollectionAndModality?Collection=<c>&Modality=<m> (subject counts) and GET .../v1/getSeries?Collection=<c>&Modality=<m> (series counts) per eligible modality'
  - collection DOIs and licences from https://www.cancerimagingarchive.net/api/v1/collections if it answers (verify), else DataCite prefix=10.7937
