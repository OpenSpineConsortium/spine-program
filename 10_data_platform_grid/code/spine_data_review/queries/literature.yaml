# Literature indexes (L1-L7), FluoroCap literature routes (F1-F8) and the supplementary venue sweep (S1).
#
# MATERIALISED BY HAND FROM information_sources.md (the protocol's single source of truth for every
# search string, PROTOCOL.md 6.1) and CHECKED, not generated: tests/test_queries_yaml.py loads the
# markdown through sdr.common.load_queries and fails on a one-byte difference for every entry with
# verbatim_in_markdown: true (Makefile protocol-check and manuscript/build.sh run it). No generator
# exists; a change to either file is made by hand in both and the test is the gate (deviations log, 2026-09-19).
# Where the markdown line is annotated or elided ("... query=", "(candidate 1)", "(verify; fallback ...)",
# "(the same body with the item_type key removed)"), `string` is the operational form the adapter
# sends and `markdown_string` keeps the markdown text verbatim so the appendix can print both.
#
# CONTRACT. A flat mapping query_id -> entry, loadable with sdr.common.load_queries(path); every
# top-level key is a query_id as it will appear in runs/<run-date>/queries.json and in Appendix A.
# Per entry: query_id, source_code (L1..S1 of the summary table), source_name, source (the adapter
# name and the key sdr.common.rate_for reads), section (the markdown heading), role (search | chase |
# enrich | probe | supplement | supplementary | fallback | conditional-split), form (fenced | grid |
# term | template | derived | regex | list-in-prose), grammar (boolean | grid | list | dump-filter |
# chase | enrich | probe | regex), string (verbatim, unencoded; the adapter URL-encodes it),
# verbatim_in_markdown, optional markdown_id / grid_id / markdown_string / markdown_prose (the sentence of
# information_sources.md that specifies an entry given in prose rather than as a block), method (GET |
# POST | local, the mention harvests that send no request), endpoint,
# string_param (which parameter receives `string`) or body (POST), params (secret-stripped; the
# placeholders <NCBI_API_KEY>, <S2_API_KEY>, <CONTACT>, <HF_TOKEN>, <GITHUB_TOKEN>, <OSF_TOKEN>,
# <SPRINGER_API_META_KEY>, <string>, <continue.*>, <base64(KAGGLE_USERNAME:KAGGLE_KEY)> are substituted by the
# adapter and never written
# to any output), headers (placeholders likewise), paging, cap (null or the cap), rate_limit,
# date_filter (api | local | none), coverage (PRISMA-ScR item 7), credential (a NAME, never a value),
# credential_free_behaviour, credential_mode_expected (the queries.json credential_mode the run is
# expected to record on a host with the credentials named in PROTOCOL.md 15 and none other: keyed |
# credential-free | needs-credentials | html-fallback | no-public-api | retired | not-run |
# mendeley-via-datacite), raw_cache_published with raw_cache_reason (summary-table column; `coverage`
# and `raw_cache_published` are copies of the summary-table cell of `source_code`, which is what the
# adapters read at run time through sdr.common.source_table and what queries.json records, so the copy
# here is evidence only while it agrees - tests/test_search_literature_fixture.py checks L1-L7 and S1
# byte for byte; `raw_cache_reason` is the long form of the same cell, the table staying authoritative), and
# syntax_notes (how this source's grammar differs from the shared term blocks). Optional keys:
# local_filter, enrichment, follow_up_requests, fallback, pre_run_check, condition, notes,
# param_variants (Open-i: one entry per yaml id, n_requests counting every variant), intervals,
# language, pass_, osf_collection, candidate_rule, condition (conditional-split ids, sent only when it
# holds), not_run_reason (ids with no adapter in this version: the run writes them as not-run with
# hits null), endpoint_rule (how the adapter chooses the endpoint when it is decided at run time),
# fallback (endpoint and mode recorded when the primary endpoint fails).
#
# Hit counts and dates are never written here; the run records them in queries.json.
# Unpaywall (S2) is a charting tool with no query_id and is absent by design.
#
pubmed_01:
  query_id: pubmed_01
  source_code: L1
  source_name: PubMed (NCBI E-utilities)
  source: pubmed
  section: L1. PubMed (E-utilities)
  role: search
  form: fenced
  grammar: boolean
  string: '(spine[tiab] OR spinal[tiab] OR vertebra*[tiab] OR lumbar[tiab] OR thoracolumbar[tiab] OR lumbosacral[tiab] OR sacrum[tiab] OR "cervical spine"[tiab] OR "thoracic spine"[tiab] OR scoliosis[tiab] OR spondylolisthesis[tiab] OR "Spine"[mh] OR "Spinal Diseases"[mh] OR "Spinal Curvatures"[mh] OR "Spinal Fractures"[mh] OR "Spinal Injuries"[mh]) AND ("computed tomography"[tiab] OR "computed tomographic"[tiab] OR CT[tiab] OR CBCT[tiab] OR "cone-beam"[tiab] OR "cone beam"[tiab] OR radiograph*[tiab] OR "X-ray"[tiab] OR "X-rays"[tiab] OR "x ray"[tiab] OR xray*[tiab] OR roentgen*[tiab] OR fluoroscop*[tiab] OR "C-arm"[tiab] OR "image intensifier"[tiab] OR DXA[tiab] OR DEXA[tiab] OR absorptiometry[tiab] OR "vertebral fracture assessment"[tiab] OR EOS[tiab] OR biplanar[tiab] OR "plain film"[tiab] OR "plain films"[tiab] OR "Tomography, X-Ray Computed"[mh] OR "Radiography"[mh] OR "Fluoroscopy"[mh] OR "Absorptiometry, Photon"[mh]) AND (dataset[tiab] OR datasets[tiab] OR "data set"[tiab] OR "data sets"[tiab] OR database[tiab] OR benchmark*[tiab] OR challenge[tiab] OR "publicly available"[tiab] OR "public data"[tiab] OR "open data"[tiab] OR "open access"[tiab] OR "open-access"[tiab] OR "open source"[tiab] OR "data descriptor"[tiab] OR corpus[tiab] OR "image collection"[tiab] OR "Datasets as Topic"[mh] OR "Databases, Factual"[mh]) AND ("2000/01/01"[dp] : "2026/12/31"[dp]) NOT (animals[mh] NOT humans[mh])'
  verbatim_in_markdown: true
  method: GET
  endpoint: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi
  string_param: term
  params:
    db: pubmed
    term: <string>
    usehistory: y
    retmax: 0
    retmode: json
    api_key: <NCBI_API_KEY>
  paging: esearch history retstart <= 9,998 (9,999 records addressable); usehistory=y then efetch.fcgi?db=pubmed&query_key=<k>&WebEnv=<w>&retstart=<i>&retmax=500&retmode=xml in batches of 500; a count above 9,999 re-runs the string as the four [dp] splits pubmed_01a-pubmed_01d, a split still above 9,999 is capped at 9,999
  cap: 9999
  rate_limit: 10/s keyed, 3/s credential-free (NCBI policy)
  date_filter: api
  coverage: 'MEDLINE 1946–; limited to 2000–2026 by [dp]'
  credential: NCBI_API_KEY
  credential_free_behaviour: api_key parameter omitted, token bucket 3/s, queries.json credential_mode = credential-free
  credential_mode_expected: keyed
  raw_cache_published: true
  raw_cache_reason: NLM terms permit redistribution of E-utilities records
  syntax_notes: 'PubMed tags: [tiab] title/abstract, [mh] MeSH heading (explodes), [ta] journal title abbreviation, [dp] date of publication with a range written "YYYY/MM/DD"[dp] : "YYYY/MM/DD"[dp]. Right truncation with * (PubMed expands a truncated term to at most 600 variants and warns; the warning is logged). Phrases in double quotes. Boolean AND OR NOT in upper case, left to right, parentheses honoured. Animal filter is the Cochrane form NOT (animals[mh] NOT humans[mh]). Records: PMID, DOI, PMCID, title, abstract, MeSH, publication types, journal, year from efetch XML.'
